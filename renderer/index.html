<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Lumox</title>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <div id="app">
    <!-- Custom frameless titlebar: tabs left · name center · controls right -->
    <header id="titlebar">
      <nav class="tb-tabs" id="tabs">
        <button class="tb-tab active" data-tab="setup">Setup</button>
        <button class="tb-tab" data-tab="control">Control</button>
      </nav>

      <div class="tb-center">
        <span class="tb-name">Lumox <span class="tb-doc">— Untitled</span></span>
      </div>

      <div class="tb-winctl">
        <button id="win-min" class="wc" title="Minimize" aria-label="Minimize">
          <svg width="10" height="10" viewBox="0 0 10 10"><line x1="1" y1="5" x2="9" y2="5"/></svg>
        </button>
        <button id="win-max" class="wc" title="Maximize" aria-label="Maximize">
          <svg width="10" height="10" viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7"/></svg>
        </button>
        <button id="win-close" class="wc wc-close" title="Close" aria-label="Close">
          <svg width="10" height="10" viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/></svg>
        </button>
      </div>
    </header>

    <main id="view">
      <section class="workspace"></section>
    </main>
  </div>
  <script type="module" src="./index.js"></script>
</body>
</html>
