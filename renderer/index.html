<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Lumox</title>
  <style>
    :root { --bg:#1a1a1a; --fg:#e8e8e8; --accent:#5eb3ff; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
                 font-family:system-ui, sans-serif; }
    .center { height:100%; display:grid; place-items:center; text-align:center; }
    h1 { font-weight:300; letter-spacing:0.05em; }
    .accent { color:var(--accent); }
    code { background:#000; padding:2px 6px; border-radius:4px; }
  </style>
</head>
<body>
  <div class="center">
    <div>
      <h1>Lumox <span class="accent">·</span> Wireless DMX Controller</h1>
      <p>UI placeholder. Engine running in main process.</p>
      <p><code>window.lumox</code> bridge is live — open DevTools to poke.</p>
    </div>
  </div>
  <script type="module" src="./index.js"></script>
</body>
</html>
